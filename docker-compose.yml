# Migration Instructions:
# 1. Export/load ConnectionStrings__Default from local .env to your terminal session.
# 2. Run: dotnet tool restore
# 3. Create migration: dotnet ef migrations add <Name> -p src/EduTwin.DAL -s src/EduTwin.DAL -o Persistence/Migrations
# 4. Apply migration: dotnet ef database update -p src/EduTwin.DAL -s src/EduTwin.DAL
services:
  mysql:
    image: mysql:8.0.35
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/EduTwin.API/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - Logging__LogLevel__Default=${Logging__LogLevel__Default:-Information}
      - ConnectionStrings__Default=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}
      - Jwt__SigningKey=${Jwt__SigningKey}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - GEMINI_LIST_KEY=${GEMINI_LIST_KEY:-}
      - Gemini__ApiKey=${Gemini__ApiKey:-}
      - Gemini__BackupKeys=${Gemini__BackupKeys:-}
      - Gemini__BackupKeys_2=${Gemini__BackupKeys_2:-}
      - Gemini__Model=${Gemini__Model}
      - AIAnalysisWorker__MaxConcurrentJobs=${AIAnalysisWorker__MaxConcurrentJobs:-4}
      - Gemini__MaxConcurrentRequests=${Gemini__MaxConcurrentRequests:-2}
      - GEMINI_QUOTA_POOLS=${GEMINI_QUOTA_POOLS:-}
      - AIGrading__MicroBatchEnabled=${AIGrading__MicroBatchEnabled:-true}
      - AIGrading__BatchSize=${AIGrading__BatchSize:-3}
      - AIGrading__BatchWindow=${AIGrading__BatchWindow:-00:00:00.150}
      - AIGrading__Provider=${AIGrading__Provider:-Gemini}
      - AIGrading__GeminiModel=${AIGrading__GeminiModel:-}
      - AIGrading__AlternativeProfileApproved=${AIGrading__AlternativeProfileApproved:-false}
      - AIGrading__GroqApiKey=${AIGrading__GroqApiKey:-}
      - AIGrading__GroqOrganizationId=${AIGrading__GroqOrganizationId:-unverified-groq-organization}
      - AIGrading__GroqModel=${AIGrading__GroqModel:-qwen/qwen3.8-27b}
      - HealthChecks__MySqlHost=${HealthChecks__MySqlHost}
      - HealthChecks__MySqlPort=${HealthChecks__MySqlPort}
      - Seed__Enabled=${Seed__Enabled:-true}
      - Seed__CenterManagerPassword=${Seed__CenterManagerPassword}
      - PlatformBootstrap__AdminUsername=${PlatformBootstrap__AdminUsername:-platform.admin}
      - PlatformBootstrap__AdminDisplayName=${PlatformBootstrap__AdminDisplayName:-Platform Administrator}
      - PlatformBootstrap__AdminPassword=${PlatformBootstrap__AdminPassword}
      - AttachmentStorage__RootPath=/app/storage
      - AttachmentStorage__DataProtectionKeysPath=/app/data-protection-keys
    ports:
      - "${API_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - attachment_storage:/app/storage
      - data_protection_keys:/app/data-protection-keys
    restart: unless-stopped

  web:
    build:
      context: ./web/edutwin-web
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-web
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: ${COMPOSE_PROJECT_NAME}-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
  attachment_storage:
  data_protection_keys:
