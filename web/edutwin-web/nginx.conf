server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - never cache index.html so browser always gets the latest bundle hashes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Never cache index.html directly
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # DOCX/media uploads have a separate cap; V1 and all other routes retain 11 MiB.
    location = /api/v1/questions/import-v2/preview {
        client_max_body_size 32m;
        proxy_read_timeout 120s;
        proxy_pass http://api:8080/api/v1/questions/import-v2/preview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Proxy
    location /api/ {
        # A 2 MiB normalized problem image becomes ~2.7 MiB in JSON/base64.
        # Application validation still enforces its smaller per-image limits.
        client_max_body_size 11m; # 10 MiB import / 5 MiB PNG plus multipart overhead
        # 'api' is the docker-compose service name
        # 8080 is the port the API container listens on internally
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
