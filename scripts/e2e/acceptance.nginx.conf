server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
    location = /api/v1/questions/import-v2/preview { client_max_body_size 32m; proxy_read_timeout 120s; proxy_pass http://edutwin-acceptance-api:8080/api/v1/questions/import-v2/preview; }
    location /api/ { client_max_body_size 11m; proxy_pass http://edutwin-acceptance-api:8080/api/; }
}
